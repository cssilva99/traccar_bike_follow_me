name: Emergency Alert (SOS / Acidente)

on:
  repository_dispatch:
    types: [traccar_sos, acidente_detectado]
  workflow_dispatch:
    inputs:
      tipo_alerta:
        description: 'Tipo de Alerta'
        required: true
        default: 'traccar_sos'
        type: choice
        options:
          - traccar_sos
          - acidente_detectado
      mensagem:
        description: 'Mensagem de teste'
        required: false
        default: 'Alerta manual de teste'

jobs:
  emergencia:
    runs-on: ubuntu-latest
    steps:
      - name: Processar Alerta
        run: |
          echo "⚠️ ALERTA RECEBIDO!"
          echo "Dados do evento:"
          echo '${{ toJson(github.event.client_payload) }}'
          echo '${{ toJson(github.event.inputs) }}'
