name: Send SMS with Twilio Trial

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'SMS message to send'
        required: true
        default: 'Hello from GitHub Actions via Twilio Trial!'

jobs:
  send_sms:
    runs-on: ubuntu-latest
    steps:
      - name: Send SMS via Twilio
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
        run: |
          echo "TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:0:5}..."  # Only show first few chars for safety
          echo "TWILIO_FROM_NUMBER: $TWILIO_FROM_NUMBER"
          echo "TWILIO_TO_NUMBER: $TWILIO_TO_NUMBER"
          curl -X POST "https://api.twilio.com/2010-04-01/Accounts/$TWILIO_ACCOUNT_SID/Messages.json" \
           --data-urlencode "From=$TWILIO_FROM_NUMBER" \
           --data-urlencode "To=$TWILIO_TO_NUMBER" \
           --data-urlencode "Body=Hello from your Twilio trial account!" \
           -u "$TWILIO_ACCOUNT_SID:$TWILIO_AUTH_TOKEN"

