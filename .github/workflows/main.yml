name: Emergency Alert(SOS / Acidente)

on:
  repository_dispatch:
    types: [traccar_sos, acidente_detectado]

jobs:
  emergencia:
    runs-on: ubuntu-latest
    steps:
      - name: Processar Alerta
        run: |
          echo "⚠️ ALERTA RECEBIDO DO TRACKER!"
          echo "Dados do evento:"
          echo '${{ toJson(github.event.client_payload) }}'
          
      # Aqui pode adicionar passos para enviar notificações, por exemplo:
      # - Enviar mensagem para o Telegram, Discord, ligar luzes inteligentes via API, etc.
