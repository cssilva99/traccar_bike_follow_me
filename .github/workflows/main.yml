name: Emergency Alert (SOS / Acidente)

on:
  repository_dispatch:
    types: [traccar_sos, acidente_detectado]
  workflow_dispatch:
    inputs:
      tipo_alerta:
        description: 'Tipo de Alerta'
        required: true
        default: 'traccar_sos'
        type: choice
        options:
          - traccar_sos
          - acidente_detectado
      mensagem:
        description: 'Mensagem de teste'
        required: false
        default: 'Alerta manual de teste'

jobs:
  emergencia:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar SMS via Twilio
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: +351919347986
          TARGET_PHONE_NUMBER: +351919347986
        run: |
          curl -X POST "https://api.twilio.com/2010-04-10/Accounts/$TWILIO_ACCOUNT_SID/Messages.json" \
            --user "$TWILIO_ACCOUNT_SID:$TWILIO_AUTH_TOKEN" \
            --data-urlencode "From=$TWILIO_PHONE_NUMBER" \
            --data-urlencode "To=$TARGET_PHONE_NUMBER" \
            --data-urlencode "Body=⚠️ ALERTA RECEBIDO! Alerta manual de teste da GitHub Action."
